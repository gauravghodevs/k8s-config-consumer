name: Pure Bash DevSecOps & SRE CI

on:
  push:
    branches: [ "main", "aws-extension" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bash-validation-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned yq v4.44.3
        run: |
          YQ_VERSION="v4.44.3"
          YQ_SHA256="a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq

      - name: Execute Validation Suite & Generate Dynamic JUnit XML
        run: ./scripts/run_test_suite.sh junit-report.xml

      - name: Build and Smoke-Test Pure Bash Consumer Container
        run: |
          docker build -t k8s-config-consumer:ci -f consumer/Dockerfile consumer/
          docker run -d --rm --name consumer-ci -p 8000:8000 k8s-config-consumer:ci
          sleep 2
          curl -f -sS http://localhost:8000/healthz | jq -e '.sli_healthy == true'
          curl -f -sS http://localhost:8000/metrics | grep -q "config_reload_errors_total"
          docker stop consumer-ci
