name: Pure Bash DevSecOps & SRE CI

on:
  push:
    branches: [ "main", "aws-extension" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bash-validation-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq and jq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          jq --version && yq --version

      - name: Lint all Bash scripts
        run: |
          bash -n scripts/validate_config.sh
          bash -n scripts/rollout_guard.sh
          bash -n lambda/bootstrap
          bash -n consumer/server.sh

      - name: Run Config Validation & Ed25519 Signature Suite
        run: |
          ./scripts/validate_config.sh config/candidate-valid.yaml
          ./scripts/validate_config.sh config/candidate-v1.3.yaml
          ./scripts/validate_config.sh config/candidate-v1.4.yaml config/candidate-v1.4.yaml.sig security/public/ed25519-public.pem
          ! ./scripts/validate_config.sh config/candidate-broken.yaml
          ! ./scripts/validate_config.sh config/candidate-oversized.yaml

      - name: Build and Smoke-Test Pure Bash Consumer Container
        run: |
          docker build -t k8s-config-consumer:ci -f consumer/Dockerfile consumer/
          docker run -d --rm --name consumer-ci -p 8000:8000 k8s-config-consumer:ci
          sleep 2
          curl -f -sS http://localhost:8000/healthz | jq -e '.sli_healthy == true'
          curl -f -sS http://localhost:8000/metrics | grep -q "slo_target_ratio"
          docker stop consumer-ci
