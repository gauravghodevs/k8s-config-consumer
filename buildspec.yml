version: 0.2
phases:
  install:
    commands:
      - YQ_VERSION="v4.44.3"
      - YQ_SHA256="a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7"
      - wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
      - echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
      - chmod +x /usr/local/bin/yq
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin "$ECR_REPO_URI"
  build:
    commands:
      - ./scripts/run_test_suite.sh junit-report.xml
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - docker build -t "$ECR_REPO_URI:$IMAGE_TAG" -f consumer/Dockerfile consumer/
      - docker push "$ECR_REPO_URI:$IMAGE_TAG"
      - ./scripts/package_lambda.sh
      - CURRENT_VER=$(aws lambda get-alias --function-name blast-radius-config-validator --name live --query 'FunctionVersion' --output text)
      - aws lambda update-function-code --function-name blast-radius-config-validator --zip-file fileb://config-validator-lambda.zip >/dev/null
      - aws lambda wait function-updated --function-name blast-radius-config-validator
      - aws lambda update-function-configuration --function-name blast-radius-config-validator --description "CodeBuild ${CODEBUILD_BUILD_NUMBER:-manual}" >/dev/null
      - aws lambda wait function-updated --function-name blast-radius-config-validator
      - TARGET_VER=$(aws lambda publish-version --function-name blast-radius-config-validator --query 'Version' --output text)
      - |
        cat <<APPSPEC > appspec.yml
        version: 0.0
        Resources:
          - myLambdaFunction:
              Type: AWS::Lambda::Function
              Properties:
                Name: "blast-radius-config-validator"
                Alias: "live"
                CurrentVersion: "${CURRENT_VER}"
                TargetVersion: "${TARGET_VER}"
        APPSPEC
reports:
  bash-validation-reports:
    files:
      - junit-report.xml
    file-format: JUNITXML
artifacts:
  files:
    - appspec.yml
    - junit-report.xml
