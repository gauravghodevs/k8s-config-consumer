version: 0.2
phases:
  install:
    commands:
      - wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
      - chmod +x /usr/local/bin/yq
  pre_build:
    commands:
      - bash -n scripts/validate_config.sh scripts/rollout_guard.sh lambda/bootstrap consumer/server.sh
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO_URI
  build:
    commands:
      - ./scripts/validate_config.sh config/candidate-valid.yaml
      - ./scripts/validate_config.sh config/candidate-v1.4.yaml config/candidate-v1.4.yaml.sig security/public/ed25519-public.pem
      - '! ./scripts/validate_config.sh config/candidate-broken.yaml'
      - '! ./scripts/validate_config.sh config/candidate-oversized.yaml'
      - docker build -t $ECR_REPO_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION -f consumer/Dockerfile consumer/
      - docker push $ECR_REPO_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION
      - (cd lambda && zip -q ../config-validator-lambda.zip bootstrap)
  post_build:
    commands:
      - |
        cat <<XML > junit-report.xml
        <testsuite name="bash-validation-suite" tests="4" failures="0">
          <testcase classname="config" name="candidate_valid_yaml"/>
          <testcase classname="config" name="candidate_v1_4_ed25519_sig"/>
          <testcase classname="config" name="reject_broken_yaml"/>
          <testcase classname="config" name="reject_oversized_yaml"/>
        </testsuite>
        XML
reports:
  bash-validation-reports:
    files:
      - junit-report.xml
    file-format: JUNITXML
artifacts:
  files:
    - config-validator-lambda.zip
    - appspec.yml
