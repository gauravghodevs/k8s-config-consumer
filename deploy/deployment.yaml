apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-consumer
  labels:
    app: config-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-consumer
  template:
    metadata:
      labels:
        app: config-consumer
    spec:
      containers:
      - name: consumer
        image: k8s-config-consumer:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: CONFIG_PATH
          value: "/etc/rules/rules.yaml"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: rules-volume
          mountPath: /etc/rules
      volumes:
      - name: rules-volume
        configMap:
          name: rules-config
