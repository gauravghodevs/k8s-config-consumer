apiVersion: v1
kind: ConfigMap
metadata:
  name: rules-config-stable
data:
  rules.yaml: |
    version: "1.0"
    rules:
      - name: block_bad_ip
        action: deny
        priority: 100
      - name: allow_internal
        action: allow
        priority: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rules-config-canary
data:
  rules.yaml: |
    version: "1.0"
    rules:
      - name: block_bad_ip
        action: deny
        priority: 100
      - name: allow_internal
        action: allow
        priority: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-stable
  labels:
    app: consumer
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: consumer
      track: stable
  template:
    metadata:
      labels:
        app: consumer
        track: stable
    spec:
      containers:
      - name: consumer
        image: k8s-config-consumer:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: CONFIG_PATH
          value: "/etc/rules/rules.yaml"
        livenessProbe:
            timeoutSeconds: 3
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
            timeoutSeconds: 3
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: rules-volume
          mountPath: /etc/rules
      volumes:
      - name: rules-volume
        configMap:
          name: rules-config-stable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-canary
  labels:
    app: consumer
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
      track: canary
  template:
    metadata:
      labels:
        app: consumer
        track: canary
    spec:
      containers:
      - name: consumer
        image: k8s-config-consumer:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: CONFIG_PATH
          value: "/etc/rules/rules.yaml"
        livenessProbe:
            timeoutSeconds: 3
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
            timeoutSeconds: 3
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: rules-volume
          mountPath: /etc/rules
      volumes:
      - name: rules-volume
        configMap:
          name: rules-config-canary
