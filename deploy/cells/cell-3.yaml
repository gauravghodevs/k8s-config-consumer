apiVersion: apps/v1
kind: Deployment
metadata:
  name: rules-consumer
  namespace: blast-cell-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rules-consumer
  template:
    metadata:
      labels:
        app: rules-consumer
        cell: cell-3
    spec:
      containers:
        - name: rules-consumer
          image: k8s-config-consumer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CONFIG_PATH
              value: /config/rules.yaml
            - name: CELL_NAME
              value: blast-cell-3
            - name: INJECT_RUNTIME_FAILURE
              value: "false"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blast-cell-3-config
